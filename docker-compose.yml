name: bookmanager

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmanager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bookmanager']
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: ./backend
      dockerfile: BookManager.Api/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=bookmanager;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seeder:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./docker/seed-authors.sql:/seed/seed-authors.sql:ro
    command:
      ['psql', '-h', 'postgres', '-U', 'postgres', '-d', 'bookmanager', '-v', 'ON_ERROR_STOP=1', '-f', '/seed/seed-authors.sql']
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: ./backend
      dockerfile: BookManager.Api/Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=bookmanager;Username=postgres;Password=postgres
    ports:
      - '127.0.0.1:5138:8080'
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5138
    ports:
      - '127.0.0.1:3000:8080'
    depends_on:
      - api

volumes:
  postgres-data:
